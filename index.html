<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://googleapis.com" rel="stylesheet">

    <title>Memory Game</title>
</head>

<body>

    <section id="homescreen" class="screen-visible">



        <div class="background-icon">
        </div>
        <img src="/src/assets/stadia_controller2.png" alt="Controller2 Icon" class="btn-play-icon2">

        <div class="hero-content">
            <div class="hero-text">
                <p class="subtitle">It's play time.</p>
                <h1 class="title">Ready to play?</h1>
            </div>
        </div>

        <button id="btn-to-settings" class="btn-primary">
            <img src="/src/assets/stadia_controller.png" alt="Controller Icon" class="btn-play-icon">
            <span class="icon-controller"></span> Play
            <img src="/src/assets/arrow1.png" alt="Arrow Icon" class="btn-arrow-icon">
        </button>
    </section>


    <section id="settings-screen" class="screen-hidden">

        <div class="settings-container">

            <div class="settings-header">
                <h2 class="settings-title">Settings</h2>
                <div class="header-line"></div>
            </div>

            <div class="settings-content">
                <form id="settings-form" class="settings-options">
                    <div class="game_Choose_Bord">
                        <div class="setting-group">
                            <div class="group-header">
                                <img src="/src/assets/setting-page/palette.png" alt="Palette Icon">
                                <h3><span> </span>Game themes</h3>
                            </div>
                            <div class="radio-options">
                                <label><input type="radio" name="theme-choice" value="Code vibes theme" checked> Code
                                    vibes theme</label>
                                <label><input type="radio" name="theme-choice" value="Gaming theme"> Gaming
                                    theme</label>
                                <label><input type="radio" name="theme-choice" value="DA Projects theme"> DA Projects
                                    theme</label>
                                <label><input type="radio" name="theme-choice" value="Foods theme"> Foods theme</label>
                            </div>
                        </div>

                        <div class="setting-group">
                            <div class="group-header">
                                <img src="/src/assets/setting-page/chess_pawn.png" alt="Chess Pawn Icon">
                                <h3><span> </span> Choose player</h3>
                            </div>
                            <div class="radio-options">
                                <label><input type="radio" name="player-choice" value="Blue" checked> Blue</label>
                                <label><input type="radio" name="player-choice" value="Orange"> Orange</label>
                            </div>
                        </div>

                        <div class="setting-group">
                            <div class="group-header">
                                <img src="/src/assets/setting-page/style.png" alt="Style Icon">
                                <h3><span> </span> Board size
                                </h3>
                            </div>
                            <div class="radio-options">
                                <label><input type="radio" name="size-choice" value="16" checked> 16 cards</label>
                                <label><input type="radio" name="size-choice" value="24"> 24 cards</label>
                                <label><input type="radio" name="size-choice" value="36"> 36 cards</label>
                            </div>
                        </div>


                    </div>

                </form>

                <div>
                    <div id="theme-preview-container" class="visual_Theme_Set"></div>


                    <div class="selectionsBtnArea">
                        <p><span id="theme-display"></span></p>
                        <div>/</div>
                        <p><span id="player-color"></span> Player</p>
                        <div>/</div>
                        <p>Board-<span id="size-display"></span></p>
                        <button id="btnStartGame">start</button>
                    </div>
                </div>
            </div>
        </div>
        </div>

    </section>

    <section id="game-screen" class="screen-hidden">
        <div class="game-header">
            <div class="score-display">
                <div class="score-box blue">Blau: <span id="score-blue-val">0</span></div>
                <div class="score-box orange">Orange: <span id="score-orange-val">0</span></div>
            </div>
            <div class="current-player-status">
                Aktueller Spieler: <span id="current-player-display" class="indicator-blue">0</span>
            </div>
            <button id="btn-exit-game" class="exit-btn">Exit Game</button>
        </div>
        <div id="game-bord" class="game-bord"></div>
    </section>


    <div id="game-over-screen" class="screen-hidden">
        <h1 id="game-over-title">Spiel vorbei!</h1>
        <p id="game-over-text">Gewinner: </p>
        <button id="btn-back-to-settings" type="button">Nochmal spielen</button>
    </div>



    <script type="module" src="/src/main.ts"></script>

</body>

</html>
